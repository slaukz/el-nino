<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buquê</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:ital,wght@1,300&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000}
body{display:grid;place-items:center;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#bg{pointer-events:none}
#w{position:relative;margin-bottom:clamp(205px,53vw,225px)}
.t{position:absolute;left:0;right:0;text-align:center;color:#fff1ec;pointer-events:none;font-family:'Italianno','Great Vibes','Snell Roundhand',cursive;font-weight:400;text-shadow:0 0 14px rgba(255,140,170,.4)}
#top{top:3%;font-size:clamp(28px,7.6vw,46px);opacity:0;transition:opacity 2.2s ease .6s}
#top.on{opacity:1}
#below{position:absolute;top:100%;left:0;right:0;margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
#bot{position:static;font-size:clamp(28px,7.6vw,42px);line-height:1.1;opacity:0;transition:opacity 2.6s ease 6s}
#bot small{display:block;font-size:.62em;line-height:1.3}
#cw{width:min(92%,370px);box-sizing:border-box;border:1px solid rgba(255,190,205,.16);border-radius:10px;background:rgba(10,6,8,.6);opacity:0;transition:opacity 1.2s ease .3s}
#cw.on{opacity:1}
#cw .hd{display:flex;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(255,190,205,.12);font:11px ui-monospace,Menlo,monospace;color:rgba(255,225,232,.45)}
#cw i{width:7px;height:7px;border-radius:50%;background:#ff6b81;box-shadow:12px 0 #ffd479,24px 0 #7bd88f;margin-right:34px}
#con{margin:0;padding:8px 12px 9px;font:11px/1.5 ui-monospace,Menlo,monospace;color:rgba(255,228,235,.88);white-space:pre;min-height:calc(1.5em*5);overflow:hidden}
#con .p{color:#ff8aa5}#con .c{color:rgba(255,200,215,.6);font-style:italic}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#bot.on{opacity:1}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:opacity 1.4s ease;-webkit-tap-highlight-color:transparent;outline:none}
#intro.off{opacity:0;pointer-events:none}
#intro h1{margin:0;font:400 clamp(64px,21vw,130px)/1.05 'Italianno','Great Vibes','Snell Roundhand',cursive;color:#ffeef0;text-shadow:0 0 22px rgba(255,140,170,.4)}
#intro p{margin:0;font:italic 300 clamp(16px,4.6vw,22px) 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;color:rgba(255,236,240,.82);animation:br 3.2s ease-in-out infinite}
@keyframes br{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){#intro p{animation:none}}
</style></head><body><canvas id="bg" style="position:fixed;inset:0"></canvas>
<div id="w"><canvas id="c"></canvas><div id="top" class="t">Son para ti, mi amor</div><div id="below"><div id="cw"><div class="hd"><i></i><span>florecer.js</span></div><pre id="con"></pre></div><div id="bot" class="t">¡Buenos días!<small>¡Que tengas un buen día de trabajo!</small></div></div></div>
<div id="intro" tabindex="0" role="button" aria-label="Começar"><h1>Grazy</h1><p>clique para começar</p></div>
<script>
(()=>{
const TAU=Math.PI*2,ASPECT=1.12,SC=1.17,END=9.4;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const off=document.createElement('canvas'),g=off.getContext('2d');
const nz=document.createElement('canvas'),nc=nz.getContext('2d');
const pat=document.createElement('canvas'),pc=pat.getContext('2d');
let SH,cols,rows,cell,pattern,parts=[],start=performance.now(),started=false;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;

/* ---------- GEOMETRIA: parâmetros de cada flor ---------- */
// x,y (fração da área), r (raio/largura), rot (graus), sy (achatamento), paleta [base,meio,ponta], z, atraso de abertura, curvatura
const P={
 topBeige:['#6b3418','#c48a5e','#ecd0a6'],topWhite:['#8c8672','#e9e3d0','#fffdf2'],
 gold:['#6a4600','#dba712','#ffe56c'],red:['#560404','#d41414','#ff5a44'],
 magenta:['#58084f','#d52ec4','#ff84f2'],white:['#8c8672','#dcd7c6','#fffff0'],
 beige:['#47301f','#b99c84','#f2dfc8'],dred:['#360404','#921010','#d43434'],
 purple:['#2c1240','#6e3d94','#aa7acc']};
const FL=[
 [.33,.47,.09,-50,.9,P.gold,1,.9,.3],        // enchimento: amarela lateral esquerda
 [.675,.49,.085,-80,.9,P.purple,1,1.1,-.3],  // enchimento: roxa lateral direita
 [.515,.275,.085,-75,.85,P.topBeige,2,.2,.2],// 1 superior central
 [.36,.325,.09,-100,.9,P.topWhite,3,.8,-.2], // 2 superior esquerda
 [.64,.33,.095,-60,.9,P.gold,3,.5,.3],       // 3 superior direita
 [.665,.75,.075,-65,.8,P.dred,4,1.2,.2],     // 9 inferior direita
 [.335,.71,.085,-110,.85,P.gold,4,1.0,-.3],  // 8 inferior esquerda
 [.40,.55,.125,-70,.88,P.magenta,5,.7,.3],   // 5 central esquerda
 [.48,.40,.14,-95,.92,P.red,6,.0,.35],       // 4 central (foco)
 [.60,.56,.125,-55,.88,P.white,7,.6,-.25],   // 6 central direita
 [.50,.70,.135,-90,.85,P.beige,8,.4,.25]     // 7 inferior central
];
FL.forEach((a,k)=>{const f={x:a[0],y:a[1],r:a[2]*1.22,rot:a[3],sy:a[4],pal:a[5],z:a[6],ex:a[7],curl:a[8]};
 f.s0=.1*k;f.bx=.5+(f.x-.5)*.12;f.lean=(f.x-.5)*1.6;
 f.c1x=f.bx;f.c1y=lerp(1.04,f.y,.5);f.c2x=f.x+(f.bx-f.x)*.25+(rnd()-.5)*.05;f.c2y=f.y+.14;
 f.jit=[];f.len=[];f.wd=[];f.bv=[];
 for(let i=0;i<6;i++){f.jit.push((rnd()-.5)*.3);f.len.push(.86+rnd()*.26);f.wd.push(.85+rnd()*.3);f.bv.push(rnd())}
 FL[k]=f});
const ORDER=FL.slice().sort((a,b)=>a.z-b.z);
// folhas: origem x,y -> ponta x,y, largura, início, duração, lado da curva
const LV=[[.49,.95,.25,.925,.016,.5,3,1],[.51,.95,.75,.91,.016,.6,3,-1],[.49,.93,.29,.83,.013,.8,3.2,1],
 [.51,.93,.71,.83,.013,.9,3.2,-1],[.49,.97,.32,1.0,.013,1.0,2.8,-1],[.51,.97,.69,1.0,.013,1.1,2.8,1],
 [.50,.92,.36,.77,.011,1.2,3.2,1],[.50,.92,.64,.79,.011,1.3,3.2,-1],[.50,.95,.43,.80,.009,1.5,3,1]];

/* ---------- DESENHO (grade baixa resolução) ---------- */
function stemPt(f,t){const u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;
 return[a*f.bx+b*f.c1x+c*f.c2x+d*f.x,a*1.04+b*f.c1y+c*f.c2y+d*f.y]}
function drawStem(f,gs){
 if(gs<=.01)return;const n=Math.max(2,Math.ceil(gs*26));
 for(const [col,w] of [['#1d6a28',Math.max(1.8,cols*.017)],['#52e060',Math.max(.9,cols*.007)]]){
  g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();
  for(let i=0;i<=n;i++){const p=stemPt(f,gs*i/n);i?g.lineTo(p[0]*cols,p[1]*SH):g.moveTo(p[0]*cols,p[1]*SH)}
  g.stroke()}}
function drawLeaf(l,t){
 const k=sm((t-l[5])/l[6]);if(k<=.01)return;
 const ox=l[0]*cols,oy=l[1]*SH,tx=ox+(l[2]*cols-ox)*k,ty=oy+(l[3]*SH-oy)*k;
 const dx=tx-ox,dy=ty-oy,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,w=l[4]*cols*k*2.2,s=l[7];
 const mx=ox+dx*.5,my=oy+dy*.5;
 const gr=g.createLinearGradient(ox,oy,tx,ty);gr.addColorStop(0,'#0e4a1a');gr.addColorStop(.6,'#23a23a');gr.addColorStop(1,'#5cf070');
 g.fillStyle=gr;g.beginPath();g.moveTo(ox,oy);
 g.quadraticCurveTo(mx+nx*w*1.7*s,my+ny*w*1.7*s,tx,ty);
 g.quadraticCurveTo(mx-nx*w*.5*s,my-ny*w*.5*s,ox,oy);g.fill();
 g.strokeStyle='rgba(170,255,170,.35)';g.lineWidth=.6;g.beginPath();g.moveTo(ox,oy);
 g.quadraticCurveTo(mx+nx*w*.6*s,my+ny*w*.6*s,tx,ty);g.stroke()}
function petal(a,L,W,curl,pal,bv,dark){
 if(L<.5)return;const b=curl*L*.14;
 g.save();g.rotate(a);
 const gr=g.createLinearGradient(0,0,L,0);gr.addColorStop(0,pal[0]);gr.addColorStop(.5,pal[1]);gr.addColorStop(1,pal[2]);
 g.globalAlpha=.86+.14*bv;g.fillStyle=gr;g.beginPath();g.moveTo(0,0);
 g.bezierCurveTo(L*.28,-W*.7,L*.6,-W*1.15,L,b);
 g.bezierCurveTo(L*.6,W*1.15+b*.3,L*.28,W*.7,0,0);g.fill();
 if(dark){g.fillStyle='rgba(0,0,0,.2)';g.fill()}
 g.globalAlpha=1;g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=.6;g.stroke();
 g.strokeStyle='rgba(0,0,0,.32)';g.beginPath();g.moveTo(L*.08,0);g.lineTo(L*.86,b*.8);g.stroke();
 g.restore()}
function drawFlower(f,t){
 const gs=sm((t-f.s0)/3.2),bud=sm((gs-.65)/.35);if(bud<=0)return;
 const e=sm((t-f.s0-2.9-f.ex)/3.4),p=stemPt(f,gs),R=f.r*cols;
 g.save();g.translate(p[0]*cols,p[1]*SH);g.scale(1,f.sy);
 const budA=-Math.PI/2+f.lean*(1-e);
 for(let layer=0;layer<2;layer++)for(let i=layer;i<6;i+=2){
  const base=f.rot*Math.PI/180+i*TAU/6+f.jit[i];
  const d=(((base-budA+Math.PI)%TAU)+TAU)%TAU-Math.PI;
  const a=budA+(i-2.5)*.07*(1-e)+d*e;
  const L=R*(layer?.9:1)*f.len[i]*(.32+.68*e)*bud;
  const W=R*.31*(layer?.9:1)*f.wd[i]*(.5+.5*e)*bud;
  petal(a,L,W,f.curl*(i%2?-1:1)*(1-.4*e),f.pal,f.bv[i],layer===1&&i%4===1)}
 if(e>.5){const k=sm((e-.5)/.5);
  for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.45+f.jit[i],l=R*.3*k;
   g.strokeStyle='rgba(255,214,110,.9)';g.lineWidth=.6;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*l,Math.sin(a)*l);g.stroke();
   g.fillStyle='#ff6a2a';g.fillRect(Math.cos(a)*l-.5,Math.sin(a)*l-.5,1.2,1.2)}}
 g.restore()}

/* ---------- PIPELINE: grade -> matriz de LEDs ---------- */
function render(t){
 g.globalCompositeOperation='source-over';g.globalAlpha=1;g.fillStyle='#000';g.fillRect(0,0,cols,rows);
 for(const q of parts){const a=(.05+.95*Math.pow(Math.abs(Math.sin(t*q.s+q.p)),3))*q.b;
  g.fillStyle='rgba(255,246,225,'+a.toFixed(2)+')';g.fillRect(q.x|0,q.y|0,1,1)}
 g.save();g.translate(cols/2,rows);g.scale(SC,SC);g.translate(-cols/2,-SH);
 for(const f of FL)drawStem(f,sm((t-f.s0)/3.2));
 for(const l of LV)drawLeaf(l,t);
 for(const f of ORDER)drawFlower(f,t);g.restore();
 const W=cv.width,H=cv.height;
 ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.drawImage(off,0,0,W,H);
 ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.4;ctx.drawImage(off,0,0,W,H);
 for(let i=0;i<50;i++){const v=150+rnd()*105|0;nc.fillStyle='rgb('+v+','+v+','+v+')';nc.fillRect(rnd()*cols|0,rnd()*rows|0,1,1)}
 ctx.globalCompositeOperation='multiply';ctx.globalAlpha=1;ctx.drawImage(nz,0,0,W,H);
 ctx.fillStyle=pattern;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='source-over'}

function setup(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const maxW=Math.min(innerWidth,(innerHeight-225)/ASPECT,760);
 cell=Math.max(3,Math.round(3.4*dpr));
 cols=Math.max(40,Math.floor(maxW*dpr/cell));rows=Math.round(cols*ASPECT);SH=cols*.95;
 cv.width=cols*cell;cv.height=rows*cell;
 cv.style.width=cv.width/dpr+'px';cv.style.height=cv.height/dpr+'px';
 off.width=nz.width=cols;off.height=nz.height=rows;
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const v=150+rnd()*105|0;nc.fillStyle='rgb('+v+','+v+','+v+')';nc.fillRect(x,y,1,1)}
 pat.width=pat.height=cell;pc.fillStyle='#000';pc.fillRect(0,0,cell,cell);
 const rg=pc.createRadialGradient(cell/2,cell/2,0,cell/2,cell/2,cell*.52);
 rg.addColorStop(0,'#fff');rg.addColorStop(.7,'#fff');rg.addColorStop(1,'#000');
 pc.fillStyle=rg;pc.beginPath();pc.arc(cell/2,cell/2,cell*.5,0,TAU);pc.fill();
 pattern=ctx.createPattern(pat,'repeat');
 parts=[];for(let i=0;i<70;i++)parts.push({x:rnd()*cols,y:rnd()*rows,s:.5+rnd()*2,p:rnd()*6,b:.25+rnd()*.75})}

setup();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const intro=document.getElementById('intro'),top_=document.getElementById('top'),bot_=document.getElementById('bot'),cw_=document.getElementById('cw');
const bg=document.getElementById('bg'),bx=bg.getContext('2d');let bp=[];
function bgSetup(){bg.width=innerWidth;bg.height=innerHeight;bp=[];for(let i=0;i<170;i++)bp.push({x:rnd()*bg.width,y:rnd()*bg.height,r:1+rnd()*1.8,s:.5+rnd()*2.2,p:rnd()*6})}
function bgDraw(now){bx.clearRect(0,0,bg.width,bg.height);const t=now/1000;for(const q of bp){const a=.05+.95*Math.pow(Math.abs(Math.sin(t*q.s+q.p)),4);bx.fillStyle='rgba(255,243,228,'+a.toFixed(2)+')';bx.fillRect(q.x-q.r/2,q.y-q.r/2,q.r,q.r);if(q.r>1.5&&a>.3){const l=q.r*4.5*a;bx.fillRect(q.x-l,q.y-.5,l*2,1);bx.fillRect(q.x-.5,q.y-l,1,l*2)}}}
bgSetup();
const pre=document.getElementById('con'),CMD='node florecer.js --para="Grazy"',FIN='// hecho con amor, solo para ti ♥';
let last='';
const bar=p=>{const n=Math.round(clamp(p)*10);return '█'.repeat(n)+'░'.repeat(10-n)};
const pct=p=>String(Math.round(clamp(p)*100)).padStart(3)+'%';
function con(t){
 if(!started)return;
 const av=(a,fn)=>a.reduce((s,x)=>s+fn(x),0)/a.length;
 const st=av(FL,f=>sm((t-f.s0)/3.2)),lv=av(LV,l=>sm((t-l[5])/l[6]));
 const bl=FL.map(f=>sm((t-f.s0-2.9-f.ex)/3.4)),op=bl.filter(e=>e>.98).length,bm=av(bl,e=>e);
 const ty=(s,from)=>s.slice(0,Math.max(0,Math.floor((t-from)*40)));
 const o=['<span class=p>$</span> '+ty(CMD,0)];
 if(t>.8)o.push('&gt; caules  '+bar(st)+pct(st));
 if(t>1.2)o.push('&gt; folhas  '+bar(lv)+pct(lv));
 if(t>2.6)o.push('&gt; flores  '+bar(bm)+' '+String(op).padStart(2)+'/'+FL.length);
 if(t>8.6)o.push('<span class=c>'+ty(FIN,8.6)+'</span>');
 const h=o.join('\n')+'<span class=cur>▌</span>';
 if(h!==last){pre.innerHTML=h;last=h}}
function go(){if(started)return;started=true;start=still?performance.now()-END*1000:performance.now();intro.classList.add('off');top_.classList.add('on');bot_.classList.add('on');cw_.classList.add('on')}
intro.addEventListener('pointerdown',go);
intro.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go()});
function loop(now){bgDraw(now);const t=started?Math.min((now-start)/1000,END):0;render(t);con(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{setup();bgSetup()},150)});

})();
</script></body></html>
